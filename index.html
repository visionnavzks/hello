<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骑自行车的鳄鱼</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            margin: 0;
        }
        svg {
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body>
    <svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="crocGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2d5016"/>
                <stop offset="50%" stop-color="#3d7026"/>
                <stop offset="100%" stop-color="#2d5016"/>
            </linearGradient>
            <linearGradient id="wheelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#333"/>
                <stop offset="50%" stop-color="#1a1a1a"/>
                <stop offset="100%" stop-color="#333"/>
            </linearGradient>
            <linearGradient id="bikeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8b4513"/>
                <stop offset="100%" stop-color="#5d2e0c"/>
            </linearGradient>
        </defs>

        <rect x="0" y="220" width="400" height="80" fill="#8B4513" rx="5"/>
        <ellipse cx="60" cy="230" rx="50" ry="10" fill="#654321" opacity="0.3"/>
        <ellipse cx="200" cy="235" rx="80" ry="8" fill="#654321" opacity="0.2"/>
        <ellipse cx="340" cy="230" rx="50" ry="10" fill="#654321" opacity="0.3"/>

        <g class="bicycle">
            <circle cx="100" cy="200" r="40" fill="white" stroke="#333" stroke-width="3"/>
            <circle cx="100" cy="200" r="35" fill="url(#wheelGradient)"/>
            <circle cx="100" cy="200" r="20" fill="white" stroke="#333" stroke-width="2"/>
            <circle cx="100" cy="200" r="8" fill="#333"/>
            <g transform="translate(100,200)">
                <line x1="0" y1="-15" x2="0" y2="15" stroke="#666" stroke-width="1"/>
                <line x1="-15" y1="0" x2="15" y2="0" stroke="#666" stroke-width="1"/>
                <line x1="-10" y1="-10" x2="10" y2="10" stroke="#666" stroke-width="1"/>
                <line x1="-10" y1="10" x2="10" y2="-10" stroke="#666" stroke-width="1"/>
            </g>

            <circle cx="300" cy="200" r="40" fill="white" stroke="#333" stroke-width="3"/>
            <circle cx="300" cy="200" r="35" fill="url(#wheelGradient)"/>
            <circle cx="300" cy="200" r="20" fill="white" stroke="#333" stroke-width="2"/>
            <circle cx="300" cy="200" r="8" fill="#333"/>
            <g transform="translate(300,200)">
                <line x1="0" y1="-15" x2="0" y2="15" stroke="#666" stroke-width="1"/>
                <line x1="-15" y1="0" x2="15" y2="0" stroke="#666" stroke-width="1"/>
                <line x1="-10" y1="-10" x2="10" y2="10" stroke="#666" stroke-width="1"/>
                <line x1="-10" y1="10" x2="10" y2="-10" stroke="#666" stroke-width="1"/>
            </g>

            <line x1="100" y1="200" x2="200" y2="160" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
            <line x1="200" y1="160" x2="300" y2="200" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
            <line x1="100" y1="200" x2="300" y2="200" stroke="#8B4513" stroke-width="3"/>

            <rect x="180" y="120" width="40" height="8" rx="4" fill="#8B4513"/>
            <circle cx="180" cy="124" r="8" fill="#333"/>
            <circle cx="220" cy="124" r="8" fill="#333"/>

            <ellipse cx="200" cy="175" rx="55" ry="25" fill="url(#bikeGradient)" stroke="#5d2e0c" stroke-width="2"/>

            <line x1="190" y1="140" x2="150" y2="180" stroke="#8B4513" stroke-width="3"/>
            <line x1="210" y1="140" x2="250" y2="180" stroke="#8B4513" stroke-width="3"/>

            <ellipse cx="200" cy="160" rx="35" ry="15" fill="#333"/>
            <ellipse cx="200" cy="160" rx="25" ry="10" fill="#444"/>
            <circle cx="200" cy="160" r="5" fill="#555"/>

            <ellipse cx="220" cy="155" rx="8" ry="5" fill="#333"/>
            <circle cx="220" cy="155" r="3" fill="#555"/>
        </g>

        <g class="crocodile">
            <ellipse cx="320" cy="130" rx="35" ry="25" fill="url(#crocGradient)"/>
            <ellipse cx="355" cy="135" rx="25" ry="20" fill="url(#crocGradient)"/>

            <ellipse cx="310" cy="125" rx="8" ry="6" fill="white"/>
            <circle cx="312" cy="125" r="4" fill="#1a1a1a"/>
            <circle cx="314" cy="123" r="1.5" fill="white"/>

            <ellipse cx="330" cy="125" rx="8" ry="6" fill="white"/>
            <circle cx="332" cy="125" r="4" fill="#1a1a1a"/>
            <circle cx="334" cy="123" r="1.5" fill="white"/>

            <path d="M340 140 Q350 150 355 145 Q360 140 355 135 Q350 130 340 140" fill="#1a1a1a"/>

            <rect x="350" y="130" width="30" height="6" rx="3" fill="#8B4513"/>
            <rect x="370" y="128" width="8" height="10" rx="2" fill="#ff6b6b"/>

            <ellipse cx="280" cy="140" rx="45" ry="30" fill="url(#crocGradient)"/>
            <ellipse cx="230" cy="150" rx="40" ry="25" fill="url(#crocGradient)"/>
            <ellipse cx="190" cy="160" rx="35" ry="20" fill="url(#crocGradient)"/>

            <path d="M280 130 Q270 120 260 125 Q250 130 255 140" stroke="#2d5016" stroke-width="2" fill="none"/>
            <path d="M265 135 Q255 125 245 130" stroke="#2d5016" stroke-width="2" fill="none"/>
            <path d="M250 140 Q240 130 230 135" stroke="#2d5016" stroke-width="2" fill="none"/>

            <path d="M190 150 Q180 145 175 150 Q170 155 175 160 Q180 165 190 160" stroke="#2d5016" stroke-width="2" fill="none"/>
            <path d="M175 155 Q165 150 160 155 Q155 160 160 165 Q165 170 175 165" stroke="#2d5016" stroke-width="2" fill="none"/>

            <ellipse cx="260" cy="165" rx="25" ry="15" fill="#3d7026" opacity="0.5"/>

            <g transform="translate(280, 155)">
                <ellipse cx="0" cy="0" rx="40" ry="20" fill="url(#crocGradient)"/>
                <rect x="-35" y="-10" width="70" height="20" rx="5" fill="#8B4513"/>
            </g>

            <ellipse cx="210" cy="130" rx="18" ry="22" fill="url(#crocGradient)"/>
            <ellipse cx="215" cy="125" rx="10" ry="15" fill="#3d7026"/>

            <ellipse cx="290" cy="120" rx="18" ry="22" fill="url(#crocGradient)"/>
            <ellipse cx="295" cy="115" rx="10" ry="15" fill="#3d7026"/>

            <ellipse cx="200" cy="175" rx="12" ry="8" fill="#ffcc00"/>
            <ellipse cx="200" cy="175" rx="8" ry="5" fill="#ff9900"/>
            <ellipse cx="200" cy="178" rx="4" ry="3" fill="#cc6600"/>

            <ellipse cx="200" cy="195" rx="15" ry="10" fill="#5d4e37"/>
            <ellipse cx="200" cy="200" rx="8" ry="5" fill="#4a3f2d"/>
        </g>

        <circle cx="300" cy="200" r="42" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
        <circle cx="100" cy="200" r="42" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
    </svg>
</body>
</html>
