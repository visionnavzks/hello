<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">High-Reach Forklift Dynamic ZVD Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto 20px auto; }
        h1 { margin: 0; color: #2c3e50; }
        .lang-switcher { display: flex; gap: 10px; }
        .lang-switcher button { padding: 5px 10px; font-size: 14px; cursor: pointer; border: 1px solid #3498db; background: transparent; color: #3498db; border-radius: 4px; }
        .lang-switcher button.active { background: #3498db; color: white; }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .params-form { display: flex; flex-wrap: wrap; gap: 15px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); justify-content: center; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #7f8c8d; }
        .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100px; }
        .controls { display: flex; justify-content: center; gap: 15px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .action-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background-color: #3498db; color: white; transition: background-color 0.3s; }
        .action-btn:hover { background-color: #2980b9; }
        .action-btn.active { background-color: #2c3e50; }
        button#btn-simulate { background-color: #e67e22; font-weight: bold; padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; transition: background-color 0.3s; }
        button#btn-simulate:hover { background-color: #d35400; }
        button#btn-play { background-color: #27ae60; font-weight: bold; padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; transition: background-color 0.3s; }
        button#btn-play:hover { background-color: #219653; }
        .canvas-container { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
        canvas#animCanvas { border: 1px solid #ddd; background-color: #fafafa; width: 100%; height: 400px; }
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #loading { display: none; text-align: center; font-size: 18px; color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

<div class="header-container">
    <h1 data-i18n="mainTitle">High-Reach Forklift Simulation (Dynamic Backend)</h1>
    <div class="lang-switcher">
        <button id="btn-lang-en" class="active" onclick="setLanguage('en')">English</button>
        <button id="btn-lang-zh" onclick="setLanguage('zh')">中文</button>
    </div>
</div>

<div class="container">
    <div class="params-form">
        <div class="form-group">
            <label data-i18n="lblFn">Freq f_n (Hz)</label>
            <input type="number" id="inp_fn" value="0.5" step="0.1">
        </div>
        <div class="form-group">
            <label data-i18n="lblZeta">Damping ζ</label>
            <input type="number" id="inp_zeta" value="0.02" step="0.01">
        </div>
        <div class="form-group">
            <label data-i18n="lblDist">Dist (m)</label>
            <input type="number" id="inp_distance" value="5.0" step="0.5">
        </div>
        <div class="form-group">
            <label data-i18n="lblVmax">V_max (m/s)</label>
            <input type="number" id="inp_vmax" value="1.0" step="0.1">
        </div>
        <div class="form-group">
            <label data-i18n="lblAmax">A_max (m/s²)</label>
            <input type="number" id="inp_amax" value="0.5" step="0.1">
        </div>
        <div class="form-group">
            <label data-i18n="lblTm">PT1 Delay T_m</label>
            <input type="number" id="inp_Tm" value="0.1" step="0.05">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button id="btn-simulate" onclick="fetchSimulation()" data-i18n="btnCalc">Recalculate Dynamics</button>
        </div>
    </div>

    <div id="loading" data-i18n="msgLoading">Calculating physical simulation on the backend...</div>

    <div class="controls">
        <button id="btn-trap" class="action-btn active" onclick="switchMode('trap')" data-i18n="btnTrap">Trapezoidal Velocity</button>
        <button id="btn-scurve" class="action-btn" onclick="switchMode('scurve')" data-i18n="btnScurve">S-Curve Velocity</button>
        <button id="btn-play" onclick="playAnimation()" data-i18n="btnPlay">Play Animation</button>
    </div>

    <div class="canvas-container">
        <canvas id="animCanvas" width="1200" height="400"></canvas>
    </div>

    <div class="charts-container">
        <div class="chart-box"><canvas id="accelChart"></canvas></div>
        <div class="chart-box"><canvas id="vibChart"></canvas></div>
        <div class="chart-box"><canvas id="velChart"></canvas></div>
        <div class="chart-box"><canvas id="posChart"></canvas></div>
    </div>
</div>

<script>
    // --- Localization ---
    const i18n = {
        'en': {
            pageTitle: 'High-Reach Forklift Dynamic ZVD Simulation',
            mainTitle: 'High-Reach Forklift Simulation (Dynamic Backend)',
            lblFn: 'Freq f_n (Hz)',
            lblZeta: 'Damping ζ',
            lblDist: 'Dist (m)',
            lblVmax: 'V_max (m/s)',
            lblAmax: 'A_max (m/s²)',
            lblTm: 'PT1 Delay T_m',
            btnCalc: 'Recalculate Dynamics',
            msgLoading: 'Calculating physical simulation on the backend...',
            btnTrap: 'Trapezoidal Velocity',
            btnScurve: 'S-Curve Velocity',
            btnPlay: 'Play Animation',
            chartTime: 'Time (s)',
            chartAccelTitle: 'Acceleration Command vs. Actual',
            chartAccelY: 'Acceleration (m/s²)',
            chartVibTitle: 'Cargo Vibration',
            chartVibY: 'Displacement (m)',
            chartVelTitle: 'Forklift Velocity',
            chartVelY: 'Velocity (m/s)',
            chartPosTitle: 'Forklift Position',
            chartPosY: 'Position (m)',
            labelTradCmd: 'Trad. (Cmd)',
            labelTradAct: 'Trad. (Act)',
            labelZVDCmd: 'ZVD (Cmd)',
            labelZVDAct: 'ZVD (Act)',
            labelTrad: 'Traditional',
            labelZVD: 'ZVD Shaped',
            canvasTime: 'Time',
            canvasTrad: 'Traditional',
            canvasZVD: 'ZVD'
        },
        'zh': {
            pageTitle: '高位叉车动态 ZVD 仿真',
            mainTitle: '高位叉车 ZVD 防晃仿真 (动态后端)',
            lblFn: '固有频率 f_n (Hz)',
            lblZeta: '阻尼比 ζ',
            lblDist: '移动距离 (m)',
            lblVmax: '最大速度 (m/s)',
            lblAmax: '最大加速度 (m/s²)',
            lblTm: '电机延迟 T_m (秒)',
            btnCalc: '重新计算动力学',
            msgLoading: '正在后端计算物理仿真数据...',
            btnTrap: '梯形速度规划',
            btnScurve: 'S型速度规划',
            btnPlay: '播放动画',
            chartTime: '时间 (秒)',
            chartAccelTitle: '加速度指令与实际底层响应对比',
            chartAccelY: '加速度 (m/s²)',
            chartVibTitle: '上方货物晃动位移',
            chartVibY: '位移 (m)',
            chartVelTitle: '叉车底盘速度',
            chartVelY: '速度 (m/s)',
            chartPosTitle: '叉车底盘位置',
            chartPosY: '位置 (m)',
            labelTradCmd: '传统 (指令)',
            labelTradAct: '传统 (实际)',
            labelZVDCmd: 'ZVD (指令)',
            labelZVDAct: 'ZVD (实际)',
            labelTrad: '传统停法',
            labelZVD: 'ZVD 优化',
            canvasTime: '时间',
            canvasTrad: '传统急停',
            canvasZVD: 'ZVD 防晃'
        }
    };

    let currentLang = 'en';

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-lang-zh').classList.toggle('active', lang === 'zh');

        // Update HTML elements
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang][key]) {
                if (el.tagName === 'TITLE') {
                    document.title = i18n[lang][key];
                } else {
                    el.innerText = i18n[lang][key];
                }
            }
        });

        // Update Charts if they exist
        if (accelChart) {
            updateCharti18n();
        }

        // Redraw canvas frame to update text if paused
        if (!isPlaying && simData) {
            drawFrame();
        }
    }

    // --- Simulation Logic ---
    let simData = null;
    let currentMode = 'trap';
    let animationId = null;
    let isPlaying = false;
    let accelChart, vibChart, velChart, posChart;

    function initCharts() {
        const createChart = (ctxId) => {
            const ctx = document.getElementById(ctxId).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: { title: { display: true, text: '', font: {size: 16} } },
                    scales: { x: { title: { display: true, text: '' } }, y: { title: { display: true, text: '' } } }
                }
            });
        };

        accelChart = createChart('accelChart');
        vibChart = createChart('vibChart');
        velChart = createChart('velChart');
        posChart = createChart('posChart');

        // Populate initial dataset structure
        accelChart.data.datasets = [
            { label: '', borderColor: 'rgba(231, 76, 60, 0.3)', borderDash: [2, 2], pointRadius: 0, data: [] },
            { label: '', borderColor: '#e74c3c', pointRadius: 0, data: [] },
            { label: '', borderColor: 'rgba(52, 152, 219, 0.3)', borderDash: [2, 2], pointRadius: 0, data: [] },
            { label: '', borderColor: '#3498db', pointRadius: 0, data: [] }
        ];

        [vibChart, velChart, posChart].forEach(chart => {
            chart.data.datasets = [
                { label: '', borderColor: '#e74c3c', borderDash: [5, 5], pointRadius: 0, data: [] },
                { label: '', borderColor: '#3498db', pointRadius: 0, data: [] }
            ];
        });

        updateCharti18n();
    }

    function updateCharti18n() {
        const t = i18n[currentLang];

        // Update Titles and Axes
        accelChart.options.plugins.title.text = t.chartAccelTitle;
        accelChart.options.scales.y.title.text = t.chartAccelY;
        accelChart.options.scales.x.title.text = t.chartTime;
        accelChart.data.datasets[0].label = t.labelTradCmd;
        accelChart.data.datasets[1].label = t.labelTradAct;
        accelChart.data.datasets[2].label = t.labelZVDCmd;
        accelChart.data.datasets[3].label = t.labelZVDAct;
        accelChart.update();

        vibChart.options.plugins.title.text = t.chartVibTitle;
        vibChart.options.scales.y.title.text = t.chartVibY;

        velChart.options.plugins.title.text = t.chartVelTitle;
        velChart.options.scales.y.title.text = t.chartVelY;

        posChart.options.plugins.title.text = t.chartPosTitle;
        posChart.options.scales.y.title.text = t.chartPosY;

        [vibChart, velChart, posChart].forEach(chart => {
            chart.options.scales.x.title.text = t.chartTime;
            chart.data.datasets[0].label = t.labelTrad;
            chart.data.datasets[1].label = t.labelZVD;
            chart.update();
        });
    }

    function updateCharts() {
        if(!simData) return;
        const modeData = simData[currentMode];

        const updateChartData = (chart, datasetsData) => {
            chart.data.labels = simData.t;
            datasetsData.forEach((d, i) => chart.data.datasets[i].data = d);
            chart.update();
        };

        updateChartData(accelChart, [modeData.raw.a_cmd, modeData.raw.a_act, modeData.zvd.a_cmd, modeData.zvd.a_act]);
        updateChartData(vibChart, [modeData.raw.y, modeData.zvd.y]);
        updateChartData(velChart, [modeData.raw.v, modeData.zvd.v]);
        updateChartData(posChart, [modeData.raw.p, modeData.zvd.p]);
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('btn-trap').classList.toggle('active', mode === 'trap');
        document.getElementById('btn-scurve').classList.toggle('active', mode === 'scurve');
        updateCharts();
        resetAnimation();
    }

    async function fetchSimulation() {
        document.getElementById('loading').style.display = 'block';
        resetAnimation();

        const payload = {
            fn: parseFloat(document.getElementById('inp_fn').value),
            zeta: parseFloat(document.getElementById('inp_zeta').value),
            distance: parseFloat(document.getElementById('inp_distance').value),
            v_max: parseFloat(document.getElementById('inp_vmax').value),
            a_max: parseFloat(document.getElementById('inp_amax').value),
            T_m: parseFloat(document.getElementById('inp_Tm').value)
        };

        try {
            const response = await fetch('/api/simulate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            simData = await response.json();
            updateCharts();
            drawFrame();
        } catch (error) {
            alert('Error fetching simulation data');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // Animation Logic
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');
    let frameIdx = 0;

    function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.moveTo(0, 360); ctx.lineTo(canvas.width, 360); ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2; ctx.stroke();

        if(!simData) return;

        const tStr = simData.t[frameIdx];
        const modeData = simData[currentMode];
        const tObj = i18n[currentLang];

        ctx.fillStyle = '#2c3e50'; ctx.font = "18px Arial";
        ctx.fillText(`${tObj.canvasTime}: ${tStr.toFixed(2)} s`, 20, 30);

        drawForkliftOverlay(modeData.raw.p[frameIdx], 200, modeData.raw.y[frameIdx], 'rgba(231, 76, 60, 0.8)', tObj.canvasTrad);
        drawForkliftOverlay(modeData.zvd.p[frameIdx], 200, modeData.zvd.y[frameIdx], 'rgba(52, 152, 219, 0.8)', tObj.canvasZVD);

        if (isPlaying) {
            frameIdx++;
            if (frameIdx < simData.t.length) {
                animationId = requestAnimationFrame(drawFrame);
            } else {
                isPlaying = false;
            }
        }
    }

    function drawForkliftOverlay(x, baseY, deflection, color, label) {
        const max_dist = parseFloat(document.getElementById('inp_distance').value);
        const scale = canvas.width * 0.8 / (max_dist + 2);
        const baseX = 50 + x * scale;

        ctx.fillStyle = color; ctx.fillRect(baseX - 40, baseY - 30, 80, 30);
        ctx.fillStyle = 'rgba(50,50,50,0.8)'; ctx.beginPath(); ctx.arc(baseX - 25, baseY, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(baseX + 25, baseY, 10, 0, Math.PI*2); ctx.fill();

        const mastHeight = 150;
        ctx.fillStyle = color; ctx.fillRect(baseX + 20, baseY - 30 - mastHeight, 6, mastHeight);

        const cargoX = baseX + 20 + (deflection * scale * 2);
        const cargoY = baseY - 30 - mastHeight;

        ctx.beginPath(); ctx.moveTo(baseX + 23, cargoY); ctx.lineTo(cargoX + 5, cargoY + 20); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = color; ctx.fillRect(cargoX - 15, cargoY + 20, 30, 30);
        ctx.fillStyle = 'white'; ctx.font = "12px Arial"; ctx.fillText(label, baseX - 30, baseY - 10);
    }

    function playAnimation() {
        if (!isPlaying && simData) {
            if (frameIdx >= simData.t.length - 1) frameIdx = 0;
            isPlaying = true;
            drawFrame();
        }
    }

    function resetAnimation() {
        isPlaying = false;
        if (animationId) cancelAnimationFrame(animationId);
        frameIdx = 0;
        drawFrame();
    }

    window.onload = () => {
        // Run initial translation assignment
        setLanguage(currentLang);
        initCharts();
        fetchSimulation();
    };
</script>
</body>
</html>
