<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>macOS 游戏桌面</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="desktop" aria-label="macOS 风格游戏桌面">
      <header class="menu-bar">
        <div class="menu-left">
          <span class="apple">●</span>
          <strong>GameOS</strong>
          <span>文件</span>
          <span>编辑</span>
          <span>游戏</span>
          <span>窗口</span>
        </div>
        <div class="menu-right">
          <span id="game-count">50 款游戏</span>
          <span id="clock">--:--</span>
        </div>
      </header>

      <section class="hero-window" aria-labelledby="hero-title">
        <div class="window-controls" aria-hidden="true">
          <span class="close"></span>
          <span class="minimize"></span>
          <span class="maximize"></span>
        </div>
        <div class="hero-content">
          <p class="eyebrow">macOS 风格 · 网页桌面</p>
          <h1 id="hero-title">欢迎来到 GameOS Arcade</h1>
          <p>在一个类 macOS 的桌面界面中浏览 50 款小游戏。点击任意图标即可打开详情并直接游玩。</p>
          <div class="search-panel">
            <label for="search">搜索游戏</label>
            <input id="search" type="search" placeholder="输入名称、类型或标签..." autocomplete="off" />
          </div>
        </div>
      </section>

      <section class="game-window" aria-labelledby="library-title">
        <div class="window-titlebar">
          <div class="window-controls" aria-hidden="true">
            <span class="close"></span>
            <span class="minimize"></span>
            <span class="maximize"></span>
          </div>
          <h2 id="library-title">游戏库</h2>
        </div>
        <div id="game-grid" class="game-grid" aria-live="polite"></div>
      </section>

      <aside id="game-detail" class="detail-window" aria-live="polite" hidden>
        <div class="window-titlebar">
          <div class="window-controls" aria-hidden="true">
            <button class="close" id="close-detail" aria-label="关闭游戏详情"></button>
            <span class="minimize"></span>
            <span class="maximize"></span>
          </div>
          <h2 id="detail-title">游戏详情</h2>
        </div>
        <div class="detail-body">
          <div id="detail-icon" class="detail-icon"></div>
          <p id="detail-type" class="detail-type"></p>
          <p id="detail-description"></p>
          <p id="detail-record" class="detail-record">成绩：暂无成绩</p>
          <button class="play-button" id="play-selected">开始游戏</button>
        </div>
      </aside>

      <section id="player-window" class="player-window" role="dialog" aria-labelledby="player-title" hidden>
        <div class="window-titlebar">
          <div class="window-controls">
            <button class="close" id="close-player" aria-label="关闭游戏"></button>
            <span class="minimize" aria-hidden="true"></span>
            <span class="maximize" aria-hidden="true"></span>
          </div>
          <h2 id="player-title">正在游戏</h2>
        </div>
        <div class="player-body">
          <div class="game-hud">
            <span id="player-score">得分 0</span>
            <span id="player-timer">时间 0</span>
            <span id="player-best">成绩 暂无成绩</span>
            <button id="restart-game" type="button">重开</button>
            <button id="back-to-library" type="button">返回游戏库</button>
          </div>
          <p id="player-instructions" class="player-instructions"></p>
          <div id="game-stage" class="game-stage" tabindex="0" aria-label="游戏区域"></div>
          <p id="game-status" class="game-status"></p>
        </div>
      </section>

      <nav id="category-dock" class="dock" aria-label="快捷 Dock"></nav>
    </main>
    <script src="game-data.js"></script>
    <script src="game-modes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
